---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dani
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: drones-as-a-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: drones-as-a-service
    spec:
      imagePullSecrets:
        - name: lighthouse-registry
      containers:
        - name: frontend
          image: lighthouse.tohka.us/drone-management/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dani
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: drones-as-a-service
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
