# Copy to k8s/01-secrets.yaml and fill in real values.
# The real file is git-ignored.
---
# Pull secret for the private registry that hosts our images.
apiVersion: v1
kind: Secret
metadata:
  name: lighthouse-registry
  namespace: dani
  labels:
    app.kubernetes.io/part-of: drones-as-a-service
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6IHsibGlnaHRob3VzZS50b2hrYS51cyI6IHsidXNlcm5hbWUiOiAiVVNFUk5BTUUiLCAicGFzc3dvcmQiOiAiUEFTU1dPUkQiLCAiYXV0aCI6ICJWVk5GVWs1QlRVVTZVRUZUVTFkUFVrUT0ifX19
---
# Per-service database credentials. One Postgres database per microservice,
# all hosted on the single CloudNativePG cluster `drones-pg`.
apiVersion: v1
kind: Secret
metadata:
  name: drones-db
  namespace: dani
  labels:
    app.kubernetes.io/part-of: drones-as-a-service
type: Opaque
stringData:
  DRONES_DATABASE_URL: postgres://drones:CHANGE_ME_DRONES@drones-pg-rw:5432/drones
  LOCATIONS_DATABASE_URL: postgres://locations:CHANGE_ME_LOCATIONS@drones-pg-rw:5432/locations
  SCHEDULING_DATABASE_URL: postgres://scheduling:CHANGE_ME_SCHEDULING@drones-pg-rw:5432/scheduling
  # Consumed by the db-init Job only.
  DRONES_DB_PASSWORD: CHANGE_ME_DRONES
  LOCATIONS_DB_PASSWORD: CHANGE_ME_LOCATIONS
  SCHEDULING_DB_PASSWORD: CHANGE_ME_SCHEDULING
---
# Shared, non-secret runtime configuration for all three microservices.
apiVersion: v1
kind: ConfigMap
metadata:
  name: drones-config
  namespace: dani
  labels:
    app.kubernetes.io/part-of: drones-as-a-service
data:
  KAFKA_BROKERS: drones-kafka-kafka-bootstrap:9092
  REDIS_URL: redis://redis:6379
  DRONE_SERVICE_URL: http://drone-management:3001
  LOCATION_SERVICE_URL: http://location-management:3002
