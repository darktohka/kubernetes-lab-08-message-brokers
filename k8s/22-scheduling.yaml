---
# Two replicas on purpose: they share the Kafka consumer groups (a message is
# handled by exactly one member) and elect a single simulator leader through a
# Postgres advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling
  namespace: dani
  labels:
    app.kubernetes.io/name: scheduling
    app.kubernetes.io/part-of: drones-as-a-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduling
        app.kubernetes.io/part-of: drones-as-a-service
    spec:
      imagePullSecrets:
        - name: lighthouse-registry
      containers:
        - name: scheduling
          image: lighthouse.tohka.us/drone-management/scheduling:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: drones-config
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: drones-db
                  key: SCHEDULING_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling
  namespace: dani
  labels:
    app.kubernetes.io/name: scheduling
    app.kubernetes.io/part-of: drones-as-a-service
spec:
  selector:
    app.kubernetes.io/name: scheduling
  ports:
    - name: http
      port: 3003
      targetPort: 3003
