---
# Creates the three microservice roles + databases inside the shared cluster.
# Idempotent: safe to re-run, and re-running also re-syncs the passwords with
# the `drones-db` secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
  namespace: dani
  labels:
    app.kubernetes.io/part-of: drones-as-a-service
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "waiting for postgres at ${PGHOST}:5432 ..."
    ready=0
    for _ in $(seq 1 90); do
      if psql -h "$PGHOST" -U "$PGUSER" -d postgres -tAc 'select 1' >/dev/null 2>&1; then ready=1; break; fi
      sleep 2
    done
    if [ "$ready" != "1" ]; then echo "postgres never became ready" >&2; exit 1; fi
    echo "postgres is ready"

    ensure_role() {
      psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d postgres -v role="$1" -v pw="$2" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'pw')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role')\gexec
    SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'role', :'pw')\gexec
    SQL
      echo "role $1 ok"
    }

    ensure_db() {
      psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d postgres -v db="$1" -v owner="$2" <<'SQL'
    SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'owner')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db')\gexec
    SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'db', :'owner')\gexec
    SQL
      echo "database $1 ok (owner $2)"
    }

    ensure_role drones      "$DRONES_DB_PASSWORD"
    ensure_role locations   "$LOCATIONS_DB_PASSWORD"
    ensure_role scheduling  "$SCHEDULING_DB_PASSWORD"

    ensure_db drones     drones
    ensure_db locations  locations
    ensure_db scheduling scheduling

    echo "--- verifying logins ---"
    for db in drones locations scheduling; do
      user=$db
      pwvar="$(echo "$db" | tr '[:lower:]' '[:upper:]')_DB_PASSWORD"
      PGPASSWORD="${!pwvar}" psql -h "$PGHOST" -U "$user" -d "$db" -tAc 'select current_database(), current_user' || {
        echo "login check failed for $user/$db" >&2; exit 1; }
    done
    echo "db-init complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: dani
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/part-of: drones-as-a-service
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16-alpine
          command: ["bash", "/scripts/init.sh"]
          env:
            - name: PGHOST
              value: drones-pg-rw
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: drones-pg-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: drones-pg-superuser
                  key: password
            - name: DRONES_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drones-db
                  key: DRONES_DB_PASSWORD
            - name: LOCATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drones-db
                  key: LOCATIONS_DB_PASSWORD
            - name: SCHEDULING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drones-db
                  key: SCHEDULING_DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: db-init-script
            defaultMode: 0755
