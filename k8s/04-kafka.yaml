---
# Kafka is managed by Strimzi (installed cluster-wide in namespace `strimzi`).
# Single broker + controller in one node pool (KRaft, no ZooKeeper).
# Bootstrap address for clients: drones-kafka-kafka-bootstrap:9092
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: dani
  labels:
    strimzi.io/cluster: drones-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: drones-kafka
  namespace: dani
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    app.kubernetes.io/part-of: drones-as-a-service
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Single-broker cluster: replication factors must stay at 1.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
      num.partitions: 3
      log.retention.hours: 12
  entityOperator:
    topicOperator: {}
---
# Declarative topics — the three messaging flows of the platform.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schedule-requests
  namespace: dani
  labels:
    strimzi.io/cluster: drones-kafka
spec:
  topicName: schedule.requests
  partitions: 3
  replicas: 1
  config:
    retention.ms: 43200000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: drone-events
  namespace: dani
  labels:
    strimzi.io/cluster: drones-kafka
spec:
  topicName: drone.events
  partitions: 3
  replicas: 1
  config:
    retention.ms: 43200000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: drone-commands
  namespace: dani
  labels:
    strimzi.io/cluster: drones-kafka
spec:
  topicName: drone.commands
  partitions: 3
  replicas: 1
  config:
    retention.ms: 43200000
    cleanup.policy: delete
